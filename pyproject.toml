[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swacanatase"
version = "0.1.0"
description = "Scaffolding for carbon nanohoop enzyme design experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "biotite>=1.0",
  "numpy>=1.26",
  "tuber",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swacanatase-download-bp5 = "swacanatase.ligands:main"
swacanatase-generate-armchair = "swacanatase.nanoring:main"
swacanatase-generate-bp5-nanorings = "swacanatase.placement:main"

[tool.uv.sources]
tuber = { path = "../tuber", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
